name: Deploy Demo Django

on:
  push:
    branches:
      - codexdeploy
  workflow_dispatch:

concurrency:
  group: deploy-demo-django
  cancel-in-progress: true

jobs:
  deploy-demo-django:
    name: Deploy Demo Django
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend demo via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          # passphrase: ${{ secrets.PASSPHRASE }}
          script: |
            set -e
            sudo -n /usr/local/bin/deploy_jni_demo_backend.sh
